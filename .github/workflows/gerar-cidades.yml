name: Gerar ruas das cidades

# Roda só quando alguém clica em "Run workflow" na aba Actions.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gerar:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: Baixar este repositório
        uses: actions/checkout@v4

      - name: Preparar o Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar as ferramentas de mapa
        run: |
          sudo apt-get update
          sudo apt-get install -y osmium-tool
          pip install osmium==4.3.1

      - name: Baixar o mapa do Brasil (OpenStreetMap, via Geofabrik)
        run: |
          curl -L --fail --retry 3 -o brasil.osm.pbf https://download.geofabrik.de/south-america/brazil-latest.osm.pbf
          ls -lh brasil.osm.pbf

      - name: Separar as ruas e a água
        run: |
          osmium tags-filter brasil.osm.pbf w/highway=motorway,trunk,primary,secondary,tertiary,unclassified,residential,living_street,road,motorway_link,trunk_link,primary_link,secondary_link,tertiary_link -o vias.osm.pbf --overwrite
          osmium tags-filter brasil.osm.pbf a/natural=water a/waterway=riverbank a/landuse=reservoir -o agua.osm.pbf --overwrite
          rm brasil.osm.pbf
          ls -lh vias.osm.pbf agua.osm.pbf

      - name: Baixar a lista de municípios (IBGE)
        run: |
          curl -L --fail -o municipios.csv https://raw.githubusercontent.com/kelvins/municipios-brasileiros/main/csv/municipios.csv
          curl -L --fail -o estados.csv https://raw.githubusercontent.com/kelvins/municipios-brasileiros/main/csv/estados.csv

      - name: Gerar um arquivo por município
        run: python gerar_cidades.py --vias vias.osm.pbf --agua agua.osm.pbf --municipios municipios.csv --estados estados.csv --saida saida

      - name: Preparar o Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Limitar a função às rotas /api (os arquivos das cidades continuam estáticos e gratuitos)
        run: echo '{"version":1,"include":["/api/*"],"exclude":[]}' > saida/_routes.json

      - name: Publicar no Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4.148.0 pages project create husky-cidades --production-branch main || true
          npx --yes wrangler@4.148.0 pages deploy saida --project-name husky-cidades --branch main --commit-dirty=true

      - name: Guardar o índice para conferência
        uses: actions/upload-artifact@v4
        with:
          name: indice-municipios
          path: saida/indice.json
